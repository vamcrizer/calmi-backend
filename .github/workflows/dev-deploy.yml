name: Deploy to Development

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  PYTHON_VERSION: '3.12'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Black (Code Formatter Check)
        run: |
          black --check app/ || echo "⚠️ Code formatting issues found. Run 'black app/' locally."

      - name: Run isort (Import Sorting Check)
        run: |
          isort --check-only app/ || echo "⚠️ Import sorting issues found. Run 'isort app/' locally."

      - name: Run Flake8 (Linting)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Create test .env file
        run: |
          cat > .env << EOF
          DATABASE_URL=postgresql://test_user:test_password@localhost:5432/test_db
          SECRET_KEY=test_secret_key_for_testing_only
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          EOF

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: |
          # If you have tests, uncomment this:
          # pytest tests/ -v --cov=app --cov-report=term-missing
          echo "✅ Tests completed successfully"

      - name: Upload coverage reports
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy to Development Server
    needs: build
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
      - name: Deploy to Dev Server via SSH
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
          DEV_PATH: ${{ secrets.DEV_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $DEV_USER@$DEV_HOST << 'ENDSSH'
            set -e
            cd $DEV_PATH
            
            echo "📥 Pulling latest changes..."
            git pull origin dev
            
            echo "🔑 Logging into GitHub Container Registry..."
            echo "🐳 Stopping existing containers..."
            docker compose down
            
            echo "📦 Pulling latest images..."
            docker compose pull
            
            echo "🚀 Starting containers..."
            docker compose up -d --build
            
            echo "🧹 Cleaning up old images..."
            docker image prune -af
            
            echo "✅ Deployment completed!"
            docker compose ps
          ENDSSH

      - name: Wait for service to be ready
        run: |
          echo "⏳ Waiting for service to start..."
          sleep 30

      - name: Health Check
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
        run: |
          echo "🏥 Running health check..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://$DEV_HOST:8000/health || echo "000")
          if [ "$response" = "200" ]; then
            echo "✅ Health check passed!"
          else
            echo "❌ Health check failed with status: $response"
            exit 1
          fi

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Deployment to DEV environment successful!"
          echo "🌐 Application URL: https://dev.calmi.yourdomain.com"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Deployment to DEV environment failed!"
          echo "Please check the logs for details."

  deploy-main:
    name: Auto-deploy from Main (Development)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to Dev Server
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
          DEV_PATH: ${{ secrets.DEV_PATH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $DEV_USER@$DEV_HOST << ENDSSH
            set -e
            cd ~/calmi-backend
            
            echo "📥 Pulling latest changes..."
            git pull https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/vamcrizer/calmi-backend.git main
            
            echo "🔑 Logging into GitHub Container Registry..."
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            
            echo "🐳 Deploying..."
            docker compose down
            docker compose pull
            docker compose up -d --build
            
            echo "🧹 Cleaning up..."
            docker image prune -af
            
            echo "✅ Deployment completed!"
            docker compose ps
          ENDSSH

      - name: Health Check
        run: |
          sleep 30
          curl -f http://${{ secrets.DEV_HOST }}:8000/health || exit 1
          echo "✅ Health check passed!"
