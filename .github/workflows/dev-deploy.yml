name: Deploy to Development

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  deploy-dev:
    name: Deploy to Development Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          # Tạo file zip của toàn bộ dự án
          zip -r backend-deploy.zip . -x '*.git*' -x 'storage/*'
          
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}

      - name: Deploy to Dev Server
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
          DEV_PATH: ${{ secrets.DEV_PATH }}
        run: |
          # Upload file zip lên server
          scp -o StrictHostKeyChecking=no backend-deploy.zip $DEV_USER@$DEV_HOST:/tmp/backend-deploy.zip
          
          # SSH vào server và thực hiện deploy
          ssh -o StrictHostKeyChecking=no $DEV_USER@$DEV_HOST "export DEV_PATH='$DEV_PATH' && bash -s" << 'ENDSSH'
            set -e
            
            # Lưu đường dẫn thư mục dự án
            PROJECT_DIR="$DEV_PATH"
            PARENT_DIR="$(dirname "$PROJECT_DIR")"
            
            echo "📂 Project directory: $PROJECT_DIR"
            echo "📂 Parent directory: $PARENT_DIR"
            
            # Backup .env từ parent directory nếu có
            if [ -f "$PARENT_DIR/.env" ]; then
              echo "✅ Found .env in parent directory"
              cp "$PARENT_DIR/.env" /tmp/backup.env
            elif [ -f "$PROJECT_DIR/.env" ]; then
              echo "✅ Found .env in project directory"
              cp "$PROJECT_DIR/.env" /tmp/backup.env
            else
              echo "⚠️  No .env file found, will use .env.example"
            fi
            
            # Stop và xóa containers hiện tại
            if [ -d "$PROJECT_DIR" ]; then
              echo "🛑 Stopping existing containers..."
              cd "$PROJECT_DIR"
              docker compose down || true
              cd ..
              
              echo "🗑️  Removing old project directory..."
              rm -rf "$PROJECT_DIR"
            fi
            
            # Tạo lại thư mục và giải nén
            echo "📦 Creating project directory and extracting files..."
            mkdir -p "$PROJECT_DIR"
            unzip -q /tmp/backend-deploy.zip -d "$PROJECT_DIR"
            
            # Copy .env vào thư mục dự án
            if [ -f /tmp/backup.env ]; then
              echo "📋 Copying .env to project directory..."
              cp /tmp/backup.env "$PROJECT_DIR/.env"
            elif [ -f "$PROJECT_DIR/.env.example" ]; then
              echo "📋 Using .env.example as template..."
              cp "$PROJECT_DIR/.env.example" "$PROJECT_DIR/.env"
            fi
            
            # Build và chạy Docker containers
            echo "🐳 Building and starting Docker containers..."
            cd "$PROJECT_DIR"
            docker compose down || true
            docker compose up -d --build
            
            # Cleanup
            rm -f /tmp/backend-deploy.zip /tmp/backup.env
            
            echo "✅ Deployment completed!"
            docker compose ps
          ENDSSH

      - name: Health Check
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
          DEV_PATH: ${{ secrets.DEV_PATH }}
        run: |
          echo "⏳ Waiting for services to start..."
          sleep 30
          
          echo "======================================"
          echo "🏥 Running Health Checks..."
          echo "======================================"
          
          # Check Backend API
          echo ""
          echo "1️⃣ Checking Backend API..."
          if curl -f -s http://$DEV_HOST:8000/health > /dev/null 2>&1; then
            echo "   ✅ Backend API is healthy"
            BACKEND_STATUS="OK"
          elif curl -f -s http://$DEV_HOST/health > /dev/null 2>&1; then
            echo "   ✅ Backend API is healthy (via proxy)"
            BACKEND_STATUS="OK"
          else
            echo "   ❌ Backend API is not responding"
            BACKEND_STATUS="FAILED"
          fi
          
          # Check Database Connection via Backend Container
          echo ""
          echo "2️⃣ Checking Azure Database Connection..."
          DB_CHECK=$(ssh -o StrictHostKeyChecking=no $DEV_USER@$DEV_HOST "export DEV_PATH='$DEV_PATH' && bash -s" << 'DBCHECK'
            cd "$DEV_PATH"
            # Check database connection through backend container
            docker compose exec -T backend python -c "
import asyncio
from sqlalchemy.ext.asyncio import create_async_engine
import os
from dotenv import load_dotenv

load_dotenv()
db_url = os.getenv('DATABASE_URL')

async def check_db():
    try:
        engine = create_async_engine(db_url, echo=False)
        async with engine.connect() as conn:
            await conn.execute('SELECT 1')
        await engine.dispose()
        print('DB_OK')
    except Exception as e:
        print(f'DB_FAILED: {e}')

asyncio.run(check_db())
" 2>&1 || echo "DB_FAILED: Cannot execute check"
          DBCHECK
          )
          
          if [[ "$DB_CHECK" == *"DB_OK"* ]]; then
            echo "   ✅ Azure Database is accepting connections"
            DB_STATUS="OK"
          else
            echo "   ❌ Azure Database connection failed"
            echo "   Details: $DB_CHECK"
            DB_STATUS="FAILED"
          fi
          
          # Check Frontend (if exists)
          echo ""
          echo "3️⃣ Checking Frontend..."
          if curl -f -s http://$DEV_HOST:3000 > /dev/null 2>&1; then
            echo "   ✅ Frontend is accessible"
            FRONTEND_STATUS="OK"
          elif curl -f -s http://$DEV_HOST > /dev/null 2>&1; then
            echo "   ✅ Frontend is accessible (via proxy)"
            FRONTEND_STATUS="OK"
          else
            echo "   ⚠️  Frontend is not accessible (may not be deployed)"
            FRONTEND_STATUS="SKIPPED"
          fi
          
          # Summary
          echo ""
          echo "======================================"
          echo "📊 Health Check Summary:"
          echo "======================================"
          echo "Backend:  $BACKEND_STATUS"
          echo "Database: $DB_STATUS"
          echo "Frontend: $FRONTEND_STATUS"
          echo "======================================"
          
          # Fail if critical services are down
          if [[ "$BACKEND_STATUS" == "FAILED" ]] || [[ "$DB_STATUS" == "FAILED" ]]; then
            echo ""
            echo "❌ Critical services are not healthy!"
            exit 1
          fi
          
          echo ""
          echo "✅ All critical services are healthy!"

      - name: Notify Success
        if: success()
        run: |
          echo "======================================"
          echo "✅ Deployment successful!"
          echo "======================================"

      - name: Notify Failure
        if: failure()
        run: |
          echo "======================================"
          echo "❌ Deployment failed!"
          echo "======================================"
