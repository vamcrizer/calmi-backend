name: Deploy to Development

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  deploy-dev:
    name: Deploy to Development Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          # Tạo file zip của toàn bộ dự án
          zip -r backend-deploy.zip . -x '*.git*' -x 'storage/*'
          
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}

      - name: Deploy to Dev Server
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
          DEV_PATH: ${{ secrets.DEV_PATH }}
        run: |
          # Upload file zip lên server
          scp -o StrictHostKeyChecking=no backend-deploy.zip $DEV_USER@$DEV_HOST:/tmp/backend-deploy.zip
          
          # SSH vào server và thực hiện deploy
          ssh -o StrictHostKeyChecking=no $DEV_USER@$DEV_HOST << 'ENDSSH'
            set -e
            
            # Lưu đường dẫn thư mục dự án
            PROJECT_DIR="${DEV_PATH}"
            PARENT_DIR="$(dirname $PROJECT_DIR)"
            
            # Backup .env từ parent directory nếu có
            if [ -f "$PARENT_DIR/.env" ]; then
              echo "✅ Found .env in parent directory"
              cp "$PARENT_DIR/.env" /tmp/backup.env
            elif [ -f "$PROJECT_DIR/.env" ]; then
              echo "✅ Found .env in project directory"
              cp "$PROJECT_DIR/.env" /tmp/backup.env
            else
              echo "⚠️  No .env file found, will use .env.example"
            fi
            
            # Stop và xóa containers hiện tại
            if [ -d "$PROJECT_DIR" ]; then
              echo "🛑 Stopping existing containers..."
              cd "$PROJECT_DIR"
              docker-compose down || true
              cd ..
              
              echo "🗑️  Removing old project directory..."
              rm -rf "$PROJECT_DIR"
            fi
            
            # Tạo lại thư mục và giải nén
            echo "📦 Creating project directory and extracting files..."
            mkdir -p "$PROJECT_DIR"
            unzip -q /tmp/backend-deploy.zip -d "$PROJECT_DIR"
            
            # Copy .env vào thư mục dự án
            if [ -f /tmp/backup.env ]; then
              echo "📋 Copying .env to project directory..."
              cp /tmp/backup.env "$PROJECT_DIR/.env"
            elif [ -f "$PROJECT_DIR/.env.example" ]; then
              echo "📋 Using .env.example as template..."
              cp "$PROJECT_DIR/.env.example" "$PROJECT_DIR/.env"
            fi
            
            # Build và chạy Docker containers
            echo "🐳 Building and starting Docker containers..."
            cd "$PROJECT_DIR"
            docker-compose down || true
            docker-compose up -d --build
            
            # Cleanup
            rm -f /tmp/backend-deploy.zip /tmp/backup.env
            
            echo "✅ Deployment completed!"
            docker-compose ps
          ENDSSH

      - name: Health Check
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
        run: |
          echo "⏳ Waiting for application to start..."
          sleep 30
          
          echo "🏥 Running health check..."
          curl -f http://$DEV_HOST:8000/health || curl -f http://$DEV_HOST/health || echo "⚠️  Health check failed"

      - name: Notify Success
        if: success()
        run: |
          echo "======================================"
          echo "✅ Deployment successful!"
          echo "======================================"

      - name: Notify Failure
        if: failure()
        run: |
          echo "======================================"
          echo "❌ Deployment failed!"
          echo "======================================"
